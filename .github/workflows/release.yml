name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  full-product-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/secret_scan.py . --history
      - name: Verify current catalog and all operation evidence
        run: |
          go build -o /tmp/cybot ./cmd/cybot
          /tmp/cybot capability coverage > /tmp/coverage.json
          python3 scripts/check_inventory.py /tmp/coverage.json
          python3 scripts/release_gate.py --coverage /tmp/coverage.json
  binaries:
    needs: full-product-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
      - name: Build versioned archives, dependency notices and checksums
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest release archives
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: 'dist/cybot_*'
