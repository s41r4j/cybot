# Curated CVE dictionary for deterministic offline lookup.
# Entries are verified high-profile vulnerabilities with keywords used by
# cve.lookup and exploit.search. This is a focused reference catalog, not the
# full CVE database; extend it as needed and keep entries evidence-backed.

cves:
  - id: CVE-2021-44228
    year: "2021"
    title: Log4Shell - Apache Log4j2 Remote Code Execution
    description: Unauthenticated remote code execution in Apache Log4j2 via JNDI lookups in logged strings.
    severity: critical
    cvss: 10.0
    cwe: CWE-502
    affected: ["Apache Log4j 2.x before 2.15.0"]
    exploit_known: true
    keywords: [log4j, log4shell, jndi, log4j2, apache]
